<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // On root deployments (Netlify, Vercel, etc.) inject <base href="/"> so that
        // relative asset paths (./assets/...) resolve correctly when the SPA rewrite
        // serves this file for deep routes like /battle/monster1.
        // GitHub Pages project pages always serve index.html from /shape-up-beast/,
        // so the relative paths already resolve correctly without a <base> override.
        if (!location.hostname.endsWith('github.io')) {
          var b = document.createElement('base');
          b.href = '/';
          document.head.insertBefore(b, document.currentScript);
        }
        // GitHub Pages 404.html redirect: /?/path → real path
        var l = window.location;
        if (l.search[1] === '/') {
          var parts = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          history.replaceState(null, null,
            l.pathname.replace(/\/$/, '') + parts[0] +
            (parts[1] ? '?' + parts[1] : '') + l.hash
          );
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
